[project]
name = "order-system-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for the order system"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]
dev = [
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
