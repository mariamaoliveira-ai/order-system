[project]
name = "order-system-consumer"
version = "0.1.0"
description = "Kafka consumer scaffold for the order system"
requires-python = ">=3.9"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
dev = ["ruff>=0.8,<1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
